<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prata&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zero the hero</title>
    <meta name="description" 
    content="a hero block with a background video that plays in cocntinuous lopp and includes and tinted overlay.">

                                 <!-- berny rios 82406-->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        body { @apply font-['Merriweather'];
             }

            @keyframes bg-change {
            0% {background-color: rgb(3, 3, 3);
            }
            100% {background-color: gray;
            }
            
               
            }
            @keyframes slide-top {
            0% {
                transform: translateY(0);
                        transform: translateY(0);
            }
            100% {
                transform: translateY(-100px);
                        transform: translateY(-100px);
                    }
        }
            @keyframes slide-top {
            0% {
                transform: translateY(0);
                        transform: translateY(0);
            }
            100% {
                transform: translateY(-100px);
                        transform: translateY(-100px);
                }


            }
           @keyframes slide-in-top{0%{transform:translateY(-1000px);
            transform:translateY(-1000px);
            opacity:0}100%{transform:translateY(0);
                transform:translateY(0);
                opacity:1
            }
        }
          @keyframes slide-in-left {
            0% {
                transform: translateX(-1000px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }

            100% {
                -webkit-transform: translateX(0);
                transform: translateX(0);
                opacity: 1;
            }
        }  
           .change-background-color {
            animation: bg-change 4s ease-in forwards;
           }
            .slide-in-top {
            animation: slide-in-top 1s ease-out forwards;
        }

            .slide-in-left {
            animation: slide-in-left 1s ease-out forwards;
        }
           

        

        header {
        @apply relative
        isolate min-h-[100vh] md:min-h-[100vh]
      
        md:bg-top
        flex flex-col justify-center
        px-8 lg:px-60 py-12
        text-center overflow-hidden;

        background-color: rgb(0, 0, 0);
        
    }
        header::before {

        @apply absolute inset-0 bg-black/40 z-0
            pointer-events-none;
    }
        header h1 {
            @apply text-7xl md:text-8xl
            text-black font-bold
            tracking-tight mb-6;
        }
        header h1,
        header h2 {
            @apply relative z-10;
            @apply text-shadow-lg/30;
        }    
        header::before {
        content: "";
        @apply absolute inset-0 bg-black/40 z-0
            pointer-events-none;
        }
        header video {
    @apply absolute inset-0
           w-full h-full
           object-cover object-center;

        }
        header h2 {
            @apply text-4xl md:text-5xl
            text-white;
        }

    </style>

</head>


<body>
    <header class="change-background-color">
        <h1 class="slide-in-top">Berny Rivers</h1>
        <h2 class="slide-in-left">Creative Web Developer</h2>
         <video
        autoplay
        muted
        loop
        playsinline
        poster="assets/castleireland.jpg">

        <source
            src="assets/videos/hands.mp4"
            type="video/mp4">
    </video>

    </header>
    <!-- /hero block -->

</body>
</html>
